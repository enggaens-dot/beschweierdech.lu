<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Beschweier dech</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000000; /* Schwarz */
      color: white;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 2em;
    }

    textarea {
      width: 100%;
      max-width: 500px;
      padding: 15px;
      border-radius: 15px;
      border: 2px solid #38bdf8;
      font-size: 16px;
      resize: none;
      margin-bottom: 15px;
      background-color: #111111;
      color: white;
    }

    textarea:focus {
      outline: none;
      border-color: #0ea5e9;
      box-shadow: 0 0 10px #0ea5e9;
    }

    button {
      padding: 12px 30px;
      border-radius: 15px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #0ea5e9;
    }

    .complaints {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 30px;
    }

    .bubble {
      background: #ffffff; /* weiß */
      color: #000000;
      padding: 15px 20px;
      border-radius: 25px;
      max-width: 400px;
      word-wrap: break-word;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>Gebe deine Beschwerde ein</h1>
  <textarea id="text" rows="3" placeholder="Schreibe deine Beschwerde hier..."></textarea><br>
  <button id="sendBtn">Senden</button>

  <div class="complaints" id="complaints"></div>

  <!-- Firebase & JavaScript -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔹 Firebase-Konfiguration direkt eingefügt
    const firebaseConfig = {
      apiKey: "AIzaSyBFV8fsdQ_yrabBSfWmlCyZEBMJ037ob1Y",
      authDomain: "beschweierdech.firebaseapp.com",
      projectId: "beschweierdech",
      storageBucket: "beschweierdech.firebasestorage.app",
      messagingSenderId: "442556247394",
      appId: "1:442556247394:web:a7a3ed0f4c5b5e1e39d03b"
    };

    // Firebase initialisieren
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Elemente abrufen
    const complaintsDiv = document.getElementById("complaints");
    const sendBtn = document.getElementById("sendBtn");

    // Funktion zum Absenden einer Beschwerde
    async function sendComplaint() {
      const text = document.getElementById("text").value.trim();
      if (!text) return;

      try {
        await addDoc(collection(db, "complaints"), {
          text,
          time: Date.now()
        });
        document.getElementById("text").value = "";
      } catch (error) {
        console.error("Fehler beim Absenden:", error);
        alert("Fehler beim Absenden der Beschwerde. Prüfe die Konsole.");
      }
    }

    // Button EventListener setzen
    sendBtn.addEventListener("click", sendComplaint);

    // Echtzeit-Anzeige aller Beschwerden
    const q = query(collection(db, "complaints"), orderBy("time", "desc"));
    onSnapshot(q, (snapshot) => {
      complaintsDiv.innerHTML = "";
      snapshot.forEach(doc => {
        const div = document.createElement("div");
        div.className = "bubble";
        div.textContent = doc.data().text;
        complaintsDiv.appendChild(div);
      });
    });
  </script>

</body>
</html>
