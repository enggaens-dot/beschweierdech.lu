<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Beschweier dech</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000000; /* Schwarz */
      color: white;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
      position: relative;
      overflow: hidden; /* damit die Sprechblasen nicht scrollen */
    }

    h1 {
      margin-bottom: 25px;
      font-size: 2em;
      position: relative;
      z-index: 2;
    }

    textarea {
      width: 100%;
      max-width: 500px;
      padding: 15px;
      border-radius: 15px;
      border: 2px solid #38bdf8;
      font-size: 16px;
      resize: none;
      margin-bottom: 15px;
      background-color: #111111;
      color: white;
      position: relative;
      z-index: 2;
    }

    textarea:focus {
      outline: none;
      border-color: #0ea5e9;
      box-shadow: 0 0 10px #0ea5e9;
    }

    button {
      padding: 12px 30px;
      border-radius: 15px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #000000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      z-index: 2;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #0ea5e9;
    }

    /* Container für die Sprechblasen */
    .complaints {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* erlaubt Klicks auf den Input/Button darunter */
    }

    .bubble {
      position: absolute;
      background: #ffffff; /* weiß */
      color: #000000;
      padding: 12px 18px;
      border-radius: 25px;
      max-width: 200px;
      word-wrap: break-word;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      animation: fadeIn 0.5s ease;
      pointer-events: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>Gebe deine Beschwerde ein</h1>
  <textarea id="text" rows="3" placeholder="Schreibe deine Beschwerde hier..."></textarea><br>
  <button id="sendBtn">Senden</button>

  <div class="complaints" id="complaints"></div>

  <!-- Firebase & JavaScript -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase-Konfiguration
    const firebaseConfig = {
      apiKey: "AIzaSyBFV8fsdQ_yrabBSfWmlCyZEBMJ037ob1Y",
      authDomain: "beschweierdech.firebaseapp.com",
      projectId: "beschweierdech",
      storageBucket: "beschweierdech.firebasestorage.app",
      messagingSenderId: "442556247394",
      appId: "1:442556247394:web:a7a3ed0f4c5b5e1e39d03b"
    };

    // Firebase initialisieren
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const complaintsDiv = document.getElementById("complaints");
    const sendBtn = document.getElementById("sendBtn");
    const textInput = document.getElementById("text");

    // Funktion zum Absenden
    async function sendComplaint() {
      const text = textInput.value.trim();
      if (!text) return;

      try {
        await addDoc(collection(db, "complaints"), {
          text: text,
          time: Date.now()
        });
        textInput.value = "";
      } catch (error) {
        console.error("Fehler beim Absenden:", error);
        alert("Fehler beim Absenden der Beschwerde. Prüfe die Konsole.");
      }
    }

    sendBtn.addEventListener("click", sendComplaint);

    // Echtzeit-Anzeige, verteilt auf dem Bildschirm
    const q = query(collection(db, "complaints"), orderBy("time", "desc"));
    onSnapshot(q, (snapshot) => {
      complaintsDiv.innerHTML = "";
      snapshot.forEach(doc => {
        const div = document.createElement("div");
        div.className = "bubble";
        div.textContent = doc.data().text;

        // Zufällige Position auf dem Bildschirm
        const x = Math.random() * (window.innerWidth - 220); // -Bubble-Breite
        const y = Math.random() * (window.innerHeight - 80); // -Bubble-Höhe
        div.style.left = `${x}px`;
        div.style.top = `${y}px`;

        complaintsDiv.appendChild(div);
      });
    });

    // Optional: Beim Resize des Fensters die Bubbles neu positionieren
    window.addEventListener('resize', () => {
      const bubbles = document.querySelectorAll('.bubble');
      bubbles.forEach(b => {
        const x = Math.random() * (window.innerWidth - 220);
        const y = Math.random() * (window.innerHeight - 80);
        b.style.left = `${x}px`;
        b.style.top = `${y}px`;
      });
    });
  </script>

</body>
</html>
