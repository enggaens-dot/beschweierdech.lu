<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Beschweier dech</title>
  <style>
   <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBFV8fsdQ_yrabBSfWmlCyZEBMJO37ob1Y",
  authDomain: "beschweierdech.firebaseapp.com",
  projectId: "beschweierdech",
  storageBucket: "beschweierdech.firebasestorage.app",
  messagingSenderId: "442556247394",
  appId: "1:442556247394:web:a7a3ed0f4c5b5e1e39d03b"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
  const firebaseConfig = {
    apiKey: "DEIN_API_KEY",
    authDomain: "DEIN_PROJEKT.firebaseapp.com",
    projectId: "DEIN_PROJEKT",
    storageBucket: "DEIN_PROJEKT.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456:web:abcdef"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const complaintsDiv = document.getElementById("complaints");

  async function sendComplaint() {
    const text = document.getElementById("text").value.trim();
    if (!text) return;

    await addDoc(collection(db, "complaints"), {
      text,
      time: Date.now()
    });

    document.getElementById("text").value = "";
  }

  const q = query(collection(db, "complaints"), orderBy("time", "desc"));
  onSnapshot(q, (snapshot) => {
    complaintsDiv.innerHTML = "";
    snapshot.forEach(doc => {
      const div = document.createElement("div");
      div.className = "bubble";
      div.textContent = doc.data().text;
      complaintsDiv.appendChild(div);
    });
  });
</script>
 
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .input-box {
      width: 100%;
      max-width: 500px;
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    textarea {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      border: none;
      resize: none;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 0 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
    }

    button:hover {
      background: #0ea5e9;
    }

    .complaints {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }

    .bubble {
      background: #1e293b;
      padding: 15px 20px;
      border-radius: 20px;
      max-width: 250px;
      position: relative;
      animation: fadeIn 0.4s ease;
    }

    .bubble::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 20px;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 10px solid #1e293b;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <h1>Gebe deine Beschwerde ein</h1>

  <div class="input-box">
    <textarea id="complaintInput" rows="3" placeholder="Schreibe deine Beschwerde hier..."></textarea>
    <button onclick="addComplaint()">Senden</button>
  </div>

  <div class="complaints" id="complaints"></div>

  <script>
    function addComplaint() {
      const input = document.getElementById("complaintInput");
      const text = input.value.trim();

      if (text === "") return;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      document.getElementById("complaints").prepend(bubble);
      input.value = "";
    }
  </script>

</body>
</html>
